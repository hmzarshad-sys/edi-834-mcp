# Publishes the web UI to GitHub Pages: https://hmzarshad-sys.github.io/edi-834-mcp/
# Runs on every push to main, so the hosted page always matches the code.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publish web UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The UI and build script have no dependencies, so no npm install is needed.
      - run: node --test "test/**/*.test.mjs"
        continue-on-error: false
      - run: node scripts/build-ui.mjs
      - run: mkdir _site && cp dist/edi-834-validator.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
